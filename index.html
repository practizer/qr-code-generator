<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator — Free Instant QR Codes</title>
  <meta name="description" content="Generate free QR codes instantly for any URL. Enter your link, tap generate, and download your QR code in seconds." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Animated background blobs -->
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2.5"/>
          <rect x="18" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2.5"/>
          <rect x="2" y="18" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2.5"/>
          <rect x="20" y="20" width="8" height="8" rx="1.5" fill="currentColor"/>
          <rect x="5" y="5" width="6" height="6" rx="1" fill="currentColor"/>
          <rect x="21" y="5" width="6" height="6" rx="1" fill="currentColor"/>
          <rect x="5" y="21" width="6" height="6" rx="1" fill="currentColor"/>
        </svg>
        <h1>QR Gen</h1>
      </div>
      <p class="tagline">Turn any link into a scannable QR code — free &amp; instant</p>
    </header>

    <!-- Input Section -->
    <section class="input-section" aria-label="URL input">
      <div class="input-wrapper" id="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <input
          type="url"
          id="url-input"
          placeholder="Paste your link here..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="clear-btn" class="clear-btn" aria-label="Clear input" title="Clear input" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <p id="error-msg" class="error-msg" role="alert"></p>
      <button id="generate-btn" class="generate-btn" disabled>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
          <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
        </svg>
        <span>Generate QR Code</span>
      </button>
    </section>

    <!-- Ad Gate Overlay -->
    <div id="ad-gate" class="ad-gate hidden">
      <div class="ad-gate-card">
        <div class="ad-gate-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="2.5" opacity="0.3"/>
            <path d="M24 14v10l7 4" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2>Almost there!</h2>
        <p>Please allow notifications to support us and unlock your QR code.</p>
        <div class="countdown-bar">
          <div id="countdown-fill" class="countdown-fill"></div>
        </div>
        <p id="countdown-text" class="countdown-text">Generating in <strong id="countdown-num">5</strong>s...</p>
      </div>
    </div>

    <!-- QR Code Result -->
    <section id="qr-result" class="qr-result hidden" aria-label="Generated QR Code">
      <div class="qr-card">
        <div class="qr-glow" aria-hidden="true"></div>
        <div id="qr-canvas" class="qr-canvas"></div>
      </div>
      <div class="qr-actions">
        <button id="download-btn" class="action-btn download-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Download PNG</span>
        </button>
        <button id="copy-btn" class="action-btn copy-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span>Copy Image</span>
        </button>
        <button id="new-btn" class="action-btn new-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>New QR</span>
        </button>
      </div>
      <p id="qr-url-display" class="qr-url-display"></p>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2026 QR Gen &mdash; Free QR Code Generator</p>
    </footer>
  </main>

  <!-- Monetag In-Page Push Ad -->
  <script>(function(s){s.dataset.zone='11617873',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

  <!-- QR Code library (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
